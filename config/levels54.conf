CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_USB_BOOT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y
# Fix BLE freeze on mouse click: enable experimental BLE on central side
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y

# Increase mouse report queue from default 1 to prevent stalls
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=8
