CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_USB_BOOT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y
# Fix BLE freeze on mouse click: enable experimental BLE on central side
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y

# Increase mouse report queue from default 1 to prevent stalls
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=8

# Fix macOS bug: keyboard shows "connected" over BLE but keys/trackballs are dead
# until the device is forgotten and re-paired. macOS doesn't re-subscribe to HID
# reports on reconnect, so if the keyboard loses its stored subscription (CCC)
# record it sends nothing. Board defconfig sets this to y; ZMK default is n.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
# Persist host subscriptions immediately instead of lazily, so power loss
# can't drop them.
CONFIG_BT_SETTINGS_CCC_STORE_ON_WRITE=y
